<html>
<head>
<title>the softer life</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400&display=swap" rel="stylesheet">
<style>
body {
  background: #293b61;
  font-family: "Spectral";
  letter-spacing: 6px;
  padding: 60px;
  color: #becce8;
  border: 1px solid #020c21;
  margin: 40px;
}

h1 {
  font-size: 28px;
  margin-bottom: 40px;
  color: #becce8;
  letter-spacing: 3px;
}

a {
  display: block;
  margin: 18px 0;
  text-decoration: none;
  color: #becce8;
  letter-spacing: 6px;
  transition: color 0.3s ease, letter-spacing 0.4s ease;
  width: fit-content;
}

a:hover {
  color: #e8d5bc;         /* warm color shift on hover */
  letter-spacing: 12px;   /* spacing ripples outward */
}

@keyframes softAppear {
  0% { opacity: 0; transform: translateY(8px); }
  100% { opacity: 1; transform: translateY(0px); }
}
  
h1 {
  animation: softAppear 0.8s ease forwards;
}

a:nth-child(2) { animation: softAppear 0.8s ease, 0.2s both; }
a:nth-child(2) { animation: softAppear 0.8s ease, 0.4s both; }
a:nth-child(2) { animation: softAppear 0.8s ease, 0.6s both; }
a:nth-child(2) { animation: softAppear 0.8s ease, 0.8s both; }
  
</style>
</head>
<body>
<h1>the softer life</h1>

<a href="projects.html">projects</a>
<a href="archive.html">archive</a>
<a href="contact.html">contact</a>
</body>
</html>
