<style>

body {
  background: #293b61;
  font-family: "Spectral";
  letter-spacing: 6px;
  padding: 60px;
  color: #becce8;
  border: 1px solid #020c21;
  position: relative;
  margin: 20px 20px;  /* top/bottom, left/right */
}

 body::before {
  content: "";
  position: fixed;
  top: 15px;
  left: 15px;
  right: 15px;
  bottom: 15px;
  border: 1px solid #020c21;
  pointer-events: none;
}

h1  {
  font-size: 20px;
  margin-bottom: 20px;
  color: #becce8;
  letter-spacing: 3px;
  font-weight: normal;
}

p {
  font-size: 16px;
  margin-bottom: 20px;
  color: #6a7fa8;
  letter-spacing: 3px;
  font-weight: thin;
}
  
h2 {
  font-size: 20px;
  letter-spacing: 4px;
  color: #becce8;
  margin-bottom: 20px;
  font-weight: normal;
}

p {
  font-size: 16px;
  margin-bottom: 20px;
  color: #6a7fa8;
  letter-spacing: 3px;
  font-weight: 100;
}
  
h3 {
  font-size: 20px;
  letter-spacing: 4px;
  color: #becce8;
  margin-bottom: 20px;
  font-weight: normal;
}

p {
  font-size: 16px;
  margin-bottom: 20px;
  color: #6a7fa8;
  letter-spacing: 3px;
  font-weight: 100;
}
  
h4 {

}

p {
  font-size: 16px;
  margin-bottom: 20px;
  color: #6a7fa8;
  letter-spacing: 3px;
  font-weight: 100;
}
  
a {
  display: block;
  margin: 18px 0;
  text-decoration: none;
  color: #becce8;
  letter-spacing: 6px;
  transition: color 0.3s ease, letter-spacing 0.4s ease;
  width: fit-content;
}

a:hover {
  color: #e8d5bc;
  letter-spacing: 12px;
}
  
.back {
  margin-top: 60px;
  font-size: 12px;
  color: #6a7fa8;
  letter-spacing: 4px;
}

.back:hover {
  color: #becce8;
  letter-spacing: 8px;
}

.back:visited {
  color: #6a7fa8 !important;
}

@keyframes softAppear {
  0% { opacity: 0; transform: translateY(8px); }
  100% { opacity: 1; transform: translateY(0px); }
}

h1  { animation: softAppear 0.8s ease 0.15s both; }
.p1 { animation: softAppear 0.8s ease 0.30s both; }
h2  { animation: softAppear 0.8s ease 0.45s both; }
.p2 { animation: softAppear 0.8s ease 0.60s both; }
h3  { animation: softAppear 0.8s ease 0.75s both; }
.p3 { animation: softAppear 0.8s ease 0.90s both; }
h4  { animation: softAppear 0.8s ease 1.05s both; }
.p4 { animation: softAppear 0.8s ease 1.20s both; }
.back { animation: softAppear 0.8s ease 1.35s both; }
